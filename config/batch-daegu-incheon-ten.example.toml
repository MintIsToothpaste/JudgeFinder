# Isolated live validation; production config/config.toml is unchanged.
# Historical window: 2025-10-05 through 2026-10-04, not open recruitments.
timezone = "Asia/Seoul"
db_path = "data/live-tests/daegu-incheon-ten-2026-10-04/notices.db"
enabled_sources = ["daegu_namgu", "daegu_bukgu", "suseong", "dalseo", "dalseong", "gunwi", "incheon", "jemulpo", "yeongjong", "michuhol"]

[sources.daegu_namgu]
municipality = "대구 남구"
source_type = "html"
engine_type = "eminwon_ofr"
list_url = "https://eminwon.nam.daegu.kr/emwp/gov/mogaha/ntis/web/ofr/action/OfrAction.do?jndinm=OfrNotAncmtEJB&context=NTIS&homepage_pbs_yn=Y&method=selectListOfrNotAncmt&methodnm=selectListOfrNotAncmtHomepage&subCheck=Y&ofr_pageSize=10&not_ancmt_se_code=01,04&list_gubun=A&countYn=Y"
recruitment_only = true
max_pages = 40
[sources.daegu_namgu.request_strategy]
session = true
referer = true
timeout_seconds = 75.0
throttle_seconds = 1.0
[sources.daegu_namgu.html_profile]
container_selector = "table.readtype2"
row_selector = "tbody tr:has(> td)"
link_selector = "td[data-table-type='subject'] a"
date_selector = "td[data-table-type='date']"
detail_title_selector = "th:-soup-contains-own('제목') + td"
detail_date_selector = "th:-soup-contains-own('등록일') + td"
id_pattern = "searchDetail\\('([1-9][0-9]*)'\\)"
detail_url_template = "/emwp/gov/mogaha/ntis/web/ofr/action/OfrAction.do?jndinm=OfrNotAncmtEJB&context=NTIS&homepage_pbs_yn=Y&method=selectOfrNotAncmt&methodnm=selectOfrNotAncmtRegst&subCheck=Y&not_ancmt_mgt_no={id}"
search_param = "not_ancmt_sj"

