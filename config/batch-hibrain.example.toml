row_selector = "tbody > tr:has(td.lin)"
link_selector = "td.lin a"
date_selector = "td:nth-of-type(4)"
id_pattern = "/bbs/b_0013/([1-9][0-9]*)(?:[?]|$)"
detail_url_template = "/web/main/bbs/b_0013/{id}"
detail_title_selector = ".post > h4.board-title"
detail_date_selector = ".post .meta li:has(> strong:-soup-contains-own('작성일')) > span"
detail_body_selector = ".board-content"
search_param = "sv"
page_param = "cp"

[sources.gimhae_bio_industry]
municipality = "김해의생명산업진흥원"
source_type = "html"
engine_type = "generic_egov_bbs"
list_url = "https://gbia.or.kr/bbs/board.php?bo_table=notice&sfl=wr_subject"
recruitment_only = true
max_pages = 10
[sources.gimhae_bio_industry.html_profile]
container_selector = "#fboardlist table"
row_selector = "tbody > tr:has(> td.td_subject a[href*='wr_id='])"
link_selector = "td.td_subject a[href*='wr_id=']"
date_selector = "td.td_date"
id_pattern = 'wr_id=([1-9][0-9]*)(?:&|$)'
detail_url_template = "/bbs/board.php?bo_table=notice&wr_id={id}"
detail_title_selector = "th:-soup-contains-own('제목') + td"
detail_date_selector = "th:-soup-contains-own('등록일') + td"
detail_body_selector = "#bo_v_con"
search_param = "stx"
page_param = "page"

[sources.woo_jin_metro_ui]
municipality = "우진메트로우이신설"
source_type = "html"
engine_type = "generic_egov_bbs"
list_url = "https://www.ui-line.com/html/info/info01/info_01_00.php"
recruitment_only = true
max_pages = 20
[sources.woo_jin_metro_ui.html_profile]
container_selector = ".bd_list > table"
row_selector = "tbody > tr:has(td.tl a[href*='pIdx='])"
link_selector = "td.tl a"
date_selector = "td:nth-of-type(4)"
id_pattern = '[?&]pIdx=([1-9][0-9]*)(?:&|$)'
detail_url_template = "/html/info/info01/info_01_00_detail.php?pIdx={id}&nowPage=1"
page_param = "nowPage"
