# Original institution boards discovered through Hibrain evaluator notices.
timezone = "Asia/Seoul"
db_path = "data/hibrain.db"
enabled_sources = ["changwon", "khoa", "lccak", "island_biennale", "daeduk", "geri", "pief", "yeongcheon_scholarship", "busan_education", "keiti", "jeonbuk_development", "ulsan_facilities", "iksan_cultural", "daegu_civil_contest", "anseong", "chungju_cultural", "namyangju_uc", "chungcheong_universiade", "seongnam_youth", "pocheon_uc", "jeonnam_content", "incheon_uc", "busan_facilities", "jinju_commerce", "seoul_environment", "gyeonggi_education_notices", "bupyeong_gender", "geoje_related", "geoje_notice", "yangsan_portal"]

[sources.changwon]
municipality = "창원시"
source_type = "html"
engine_type = "generic_egov_bbs"
list_url = "https://www.changwon.go.kr/cwportal/10310/10438/10439.web?section=gosi&stype=title"
recruitment_only = false
max_pages = 100
[sources.changwon.request_strategy]
session = true
referer = true
retries = 2
timeout_seconds = 35.0
throttle_seconds = 0.3
[sources.changwon.html_profile]
container_selector = "div.list2table1 table"
# Expired notices lose their detail links; collect public linked rows only.
row_selector = "tbody > tr:has(> td.tal > a)"
link_selector = "td.tal a"
date_selector = "td:nth-of-type(5)"
id_pattern = '[?&]not_ancmt_mgt_no=([1-9][0-9]*)(?:&|$)'
detail_url_template = "/cwportal/10310/10438/10439.web?amode=view&section=gosi&not_ancmt_mgt_no={id}"
detail_title_selector = ".bbs1view1 > h1.h1"
detail_date_selector = ".bbs1view1 dt:-soup-contains-own('게재일자') + dd"
search_param = "sstring"
page_param = "cpage"
page_number_selector = ".pagination .pages .on"

