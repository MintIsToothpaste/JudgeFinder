# Isolated public HTML validation. Production settings and DB stay unchanged.
# Window: 2025-10-05 through 2026-10-04.
# Bucheon/Pyeongtaek are diagnostic-only until expired-notice coverage is verified.
timezone = "Asia/Seoul"
db_path = "data/live-tests/gyeonggi-cities-ten-2026-10-04/notices.db"
enabled_sources = ["seongnam","uijeongbu","anyang","bucheon","gwangmyeong","pyeongtaek","dongducheon","ansan","goyang","gwacheon"]

[sources.seongnam]
municipality = "성남시"
source_type = "html"
engine_type = "eminwon_ofr"
list_url = "https://eminwon.seongnam.go.kr/emwp/gov/mogaha/ntis/web/ofr/action/OfrAction.do?jndinm=OfrNotAncmtEJB&context=NTIS&method=selectListOfrNotAncmt&methodnm=selectListOfrNotAncmtHomepage&homepage_pbs_yn=Y&subCheck=Y&ofr_pageSize=10&list_gubun=A&not_ancmt_se_code=01,04,05"
recruitment_only = true
max_pages = 40
[sources.seongnam.request_strategy]
session = true
referer = true
timeout_seconds = 45.0
throttle_seconds = 1.0
[sources.seongnam.html_profile]
row_selector = "tbody > tr:has(> td)"
container_selector = "table.bd00Bbs"
link_selector = "td.title a"
link_attribute = "onclick"
date_selector = "td:nth-of-type(5)"
detail_title_selector = "th:-soup-contains-own('제목') + td"
detail_date_selector = "th:-soup-contains-own('등록일') + td"
id_pattern = "searchDetail[(]'([1-9][0-9]*)'"
detail_url_template = "/emwp/gov/mogaha/ntis/web/ofr/action/OfrAction.do?jndinm=OfrNotAncmtEJB&context=NTIS&homepage_pbs_yn=Y&method=selectOfrNotAncmt&methodnm=selectOfrNotAncmtRegst&subCheck=Y&not_ancmt_mgt_no={id}"
search_param = "not_ancmt_sj"
page_param = "pageIndex"

