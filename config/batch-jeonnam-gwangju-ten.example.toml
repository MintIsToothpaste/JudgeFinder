# Isolated validation only. Production config is not changed.
# Window: 2025-10-05 through 2026-10-04.
timezone = "Asia/Seoul"
db_path = "data/live-tests/jeonnam-gwangju-ten-2026-10-04/notices.db"
enabled_sources = ["yeosu", "yeosu_current", "suncheon", "naju", "naju_current", "gwangyang", "gwangju_donggu", "gwangju_seogu", "gwangju_seogu_current", "gwangju_namgu", "gwangju_bukgu", "gwangsan", "damyang"]

[sources.yeosu]
municipality = "여수시"
source_type = "html"
engine_type = "generic_egov_bbs"
list_url = "https://www.yeosu.go.kr/www/govt/news/notify/complete_notify?search_type=title"
recruitment_only = true
max_pages = 40
[sources.yeosu.request_strategy]
session = true
referer = true
timeout_seconds = 75.0
throttle_seconds = 1.0
[sources.yeosu.html_profile]
container_selector = "table.board_basic"
row_selector = "tbody tr:has(> td)"
link_selector = "td:nth-of-type(3) a"
date_selector = "td:nth-of-type(5)"
detail_title_selector = "div.view_titlebox h3"
detail_date_selector = "div.view_titlebox dt:-soup-contains-own('날짜') + dd"
id_pattern = "idx=([1-9][0-9]*)"
detail_url_template = "/www/govt/news/notify/complete_notify?idx={id}&mode=view"
search_param = "search_word"
page_param = "page"

