# Isolated validation. Unrecovered municipalities remain held in the report.
timezone = "Asia/Seoul"
db_path = "data/live-tests/held-eighteen-2026-10-05/notices.db"
enabled_sources = ["pyeongchang", "sangju", "andong", "namyangju"]

[sources.pyeongchang]
municipality = "평창군"
source_type = "html"
engine_type = "eminwon_ofr"
list_url = "https://eminwon.pc.go.kr/emwp/gov/mogaha/ntis/web/ofr/action/OfrAction.do?jndinm=OfrNotAncmtEJB&context=NTIS&method=selectListOfrNotAncmt&methodnm=selectListOfrNotAncmtHomepage&homepage_pbs_yn=Y&subCheck=Y&ofr_pageSize=10&list_gubun=A&not_ancmt_se_code=01%2C04"
recruitment_only = true
max_pages = 80
[sources.pyeongchang.request_strategy]
session = true
referer = true
retries = 2
timeout_seconds = 30.0
throttle_seconds = 0.3
[sources.pyeongchang.html_profile]
container_selector = "table[width='660px']:has(> tbody > tr > td.bbs_title:-soup-contains-own('등록일'))"
row_selector = ":scope > tbody > tr:has(> td[onclick])"
page_param = "pageIndex"
search_param = "not_ancmt_sj"
date_selector = "td:nth-of-type(8)"
link_selector = "td:nth-of-type(4)"
link_attribute = "onclick"
id_pattern = "searchDetail[(]'([1-9][0-9]*)'"
detail_origin = "https://www.pc.go.kr"
detail_url_template = "https://www.pc.go.kr/portal/government/government-notification?noticeMgrNo={id}"
detail_title_selector = "div.skinTb-sbj"
page_number_selector = ".page_no b"

[sources.sangju]
municipality = "상주시"
source_type = "html"
engine_type = "eminwon_ofr"
list_url = "https://eminwon.sangju.go.kr/emwp/gov/mogaha/ntis/web/ofr/action/OfrAction.do?jndinm=OfrNotAncmtEJB&context=NTIS&method=selectListOfrNotAncmt&methodnm=selectListOfrNotAncmtHomepage&homepage_pbs_yn=Y&subCheck=N&ofr_pageSize=10&list_gubun=A&not_ancmt_se_code=01%2C02%2C03%2C04%2C05%2C07"
recruitment_only = true
max_pages = 80
[sources.sangju.request_strategy]
session = true
referer = true
retries = 2
timeout_seconds = 30.0
throttle_seconds = 0.3
[sources.sangju.html_profile]
container_selector = "table[align='center'][cellspacing='1']"
row_selector = ":scope > tbody > tr:has(> td a[onclick])"
page_param = "pageIndex"
search_param = "not_ancmt_sj"
date_selector = "td:nth-of-type(5)"
link_selector = "td:nth-of-type(3) a"
link_attribute = "onclick"
id_pattern = "searchDetail[(]'([1-9][0-9]*)'"
detail_url_template = "/emwp/gov/mogaha/ntis/web/ofr/action/OfrAction.do?jndinm=OfrNotAncmtEJB&context=NTIS&homepage_pbs_yn=Y&method=selectOfrNotAncmt&methodnm=selectOfrNotAncmtRegst&subCheck=N&not_ancmt_mgt_no={id}"
detail_title_selector = "th:-soup-contains-own('제목') + td"
detail_date_selector = "th:-soup-contains-own('등록일') + td"
page_number_selector = ".page_no b"

[sources.andong]
municipality = "안동시"
source_type = "html"
engine_type = "generic_egov_bbs"
list_url = "https://www.andong.go.kr/portal/saeol/gosi/list.do?mId=0401020100&searchType=tit"
recruitment_only = true
max_pages = 80
[sources.andong.request_strategy]
session = true
referer = true
retries = 2
timeout_seconds = 30.0
throttle_seconds = 0.3
[sources.andong.html_profile]
container_selector = "table.bod_list"
row_selector = ":scope > tbody > tr:has(> td)"
page_param = "page"
search_param = "searchTxt"
date_selector = "td:nth-of-type(5)"
link_selector = "td:nth-of-type(3) a"
id_pattern = "notAncmtMgtNo=([1-9][0-9]*)(?:&|$)"
detail_url_template = "/portal/saeol/gosi/view.do?notAncmtMgtNo={id}&isLinkage=Y&mId=0401020100"
detail_title_selector = "table.bod_view th.title"
detail_date_selector = "table.bod_view th.list_date + td"
page_number_selector = ".page_num span.bold.red"

