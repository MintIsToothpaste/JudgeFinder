# Isolated actual public crawling; production settings and DB stay unchanged.
# Window: 2025-10-05 through 2026-10-04.
# Namyangju is diagnostic-only: full archive coverage is unverified.
timezone = "Asia/Seoul"
db_path = "data/live-tests/gyeonggi-cities-next-ten-2026-10-04/notices.db"
enabled_sources = ["guri","namyangju","osan","siheung","gunpo","uiwang","yongin","paju","icheon","gimpo"]

[sources.guri]
municipality = "구리시"
source_type = "html"
engine_type = "eminwon_ofr"
list_url = "https://eminwon.guri.go.kr/emwp/gov/mogaha/ntis/web/ofr/action/OfrAction.do?jndinm=OfrNotAncmtEJB&context=NTIS&method=selectListOfrNotAncmt&methodnm=selectListOfrNotAncmtHomepage&homepage_pbs_yn=Y&subCheck=Y&ofr_pageSize=10&list_gubun=A&not_ancmt_se_code=01,04,06"
recruitment_only = true
max_pages = 40
[sources.guri.request_strategy]
session = true
referer = true
timeout_seconds = 45.0
throttle_seconds = 1.0
[sources.guri.html_profile]
row_selector = "tbody > tr:has(> td)"
date_selector = "td:nth-of-type(5)"
link_selector = "td:nth-of-type(3) a"
detail_title_selector = "th:-soup-contains-own('제목') + td"
detail_date_selector = "th:-soup-contains-own('작성일') + td"
page_param = "pageIndex"
container_selector = "table.list"
link_attribute = "onclick"
id_pattern = "searchDetail[(]'([1-9][0-9]*)'"
detail_url_template = "/emwp/gov/mogaha/ntis/web/ofr/action/OfrAction.do?jndinm=OfrNotAncmtEJB&context=NTIS&homepage_pbs_yn=Y&method=selectOfrNotAncmt&methodnm=selectOfrNotAncmtRegst&subCheck=Y&not_ancmt_mgt_no={id}"
search_param = "not_ancmt_sj"

[sources.namyangju]
municipality = "남양주시"
source_type = "html"
engine_type = "generic_egov_bbs"
