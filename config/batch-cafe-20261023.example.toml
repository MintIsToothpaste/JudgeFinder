# Public supplementary boards identified from cafe evaluator notices dated 2026-10-23.
# Keep registration dates and public reposting provenance; collect broadly for manual review.
timezone = "Asia/Seoul"
db_path = "data/cafe-20261023.db"
enabled_sources = ["udik", "jemulpo_notice", "gwacheon_uc", "chungnam", "chungbuk_sido", "yulgok", "jeonju_cultural", "gyeongnam_education", "jeju_education", "seoul_education", "jemulpo_khu"]

[sources.udik]
municipality = "한국도시설계학회 (지자체 공고 재게시)"
source_type = "html"
engine_type = "generic_egov_bbs"
list_url = "https://www.udik.or.kr/board/?ncode=a0003&sc_sec1=1"
recruitment_only = false
max_pages = 100
[sources.udik.request_strategy]
session = true
referer = true
retries = 2
timeout_seconds = 30.0
throttle_seconds = 0.3
[sources.udik.html_profile]
container_selector = "table.table-striped"
row_selector = "tbody > tr"
link_selector = "td:nth-of-type(2) a"
date_selector = "td:nth-of-type(5)"
id_pattern = "num=([1-9][0-9]*)(?:&|$)"
detail_url_template = "/board/?_0000_method=view&ncode=a0003&num={id}"
search_param = "sc_keyword"
page_param = "page"
request_method = "POST"
detail_title_selector = "table.table-header td:nth-of-type(1)"
detail_date_selector = "table.table-header td:nth-of-type(3)"

[sources.jemulpo_notice]
municipality = "제물포구"
source_type = "html"
engine_type = "generic_egov_bbs"
list_url = "https://www.jemulpo.go.kr/main/bbs/bbsMsgList.do?bcd=notice&listsz=50"
recruitment_only = false
max_pages = 100
available_from = "2026-07-01"
[sources.jemulpo_notice.request_strategy]
session = true
referer = true
retries = 2
timeout_seconds = 75.0
throttle_seconds = 0.3
[sources.jemulpo_notice.html_profile]
container_selector = "div.board-list table"
row_selector = "tbody tr:has(> td)"
link_selector = "td.title a"
date_selector = "td:nth-of-type(5)"
id_pattern = "msg_seq=([1-9][0-9]*)"
detail_url_template = "/main/bbs/bbsMsgDetail.do?bcd=notice&msg_seq={id}"
page_param = "pgno"
detail_date_selector = "dt:-soup-contains-own('작성일') + dd"
title_exclude_selector = ".new"

