# Isolated live validation; production config/config.toml is unchanged.
# Historical window: 2025-10-04 through 2026-10-03, not open recruitments.
# list_gubun=A includes expired postings; the portal's relative-date cutoff is omitted.
timezone = "Asia/Seoul"
db_path = "data/live-tests/busan-ten-2026-10-03/notices.db"
enabled_sources = ["busan_junggu", "busan_seogu", "busan_donggu", "yeongdo", "busanjin", "dongnae", "busan_namgu", "busan_bukgu", "haeundae", "saha"]

[sources.busan_junggu]
municipality = "부산 중구"
source_type = "html"
engine_type = "eminwon_ofr"
list_url = "https://eminwon.bsjunggu.go.kr/emwp/gov/mogaha/ntis/web/ofr/action/OfrAction.do?jndinm=OfrNotAncmtEJB&context=NTIS&homepage_pbs_yn=Y&method=selectListOfrNotAncmt&methodnm=selectListOfrNotAncmtHomepage&subCheck=Y&ofr_pageSize=10&not_ancmt_se_code=01,04&list_gubun=A&homepagetype=new&countYn=Y&Key=B_Subject"
recruitment_only = true
[sources.busan_junggu.request_strategy]
session = true
referer = true
timeout_seconds = 75.0
throttle_seconds = 1.0
[sources.busan_junggu.html_profile]
container_selector = "table.eminwon_board"
row_selector = "tbody tr:has(> td)"
link_selector = "td.subject a"
detail_title_selector = "table.bbs_vtype th[colspan='4']"
detail_date_selector = "th:-soup-contains-own('등록일') + td"
id_pattern = "searchDetail\\('([1-9][0-9]*)'\\)"
detail_url_template = "/emwp/gov/mogaha/ntis/web/ofr/action/OfrAction.do?jndinm=OfrNotAncmtEJB&context=NTIS&homepage_pbs_yn=Y&method=selectOfrNotAncmt&methodnm=selectOfrNotAncmtRegst&subCheck=Y&homepagetype=new&not_ancmt_mgt_no={id}"
search_param = "not_ancmt_sj"

