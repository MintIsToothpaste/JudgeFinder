# Isolated real-response validation. Production config and DB are unchanged.
# Window: 2025-10-05 through 2026-10-04.
timezone = "Asia/Seoul"
db_path = "data/live-tests/jeonnam-counties-ten-2026-10-04/notices.db"
enabled_sources = ["gokseong", "gurye", "goheung", "boseong", "hwasun", "jangheung", "jangheung_current", "gangjin", "gangjin_current", "haenam", "yeongam", "muan"]

[sources.gokseong]
municipality = "곡성군"
source_type = "html"
engine_type = "eminwon_ofr"
list_url = "https://eminwon.gokseong.go.kr/emwp/gov/mogaha/ntis/web/ofr/action/OfrAction.do?not_ancmt_se_code=01,04,05&jndinm=OfrNotAncmtEJB&context=NTIS&method=selectListOfrNotAncmt&methodnm=selectListOfrNotAncmtHomepage&ofr_pageSize=10&homepage_pbs_yn=Y&subCheck=Y&list_gubun=A"
recruitment_only = true
max_pages = 40
[sources.gokseong.request_strategy]
session = true
referer = true
timeout_seconds = 75.0
throttle_seconds = 1.0
[sources.gokseong.html_profile]
container_selector = "table[width='98%'][cellspacing='1']"
row_selector = "tbody > tr:has(> td[onclick])"
link_selector = "td:nth-of-type(3)[onclick]"
link_attribute = "onclick"
date_selector = "td:nth-of-type(5)"
detail_title_selector = "td:-soup-contains-own('제목') + td"
detail_date_selector = "td:-soup-contains-own('등록일') + td"
id_pattern = "searchDetail[(]'([1-9][0-9]*)'"
detail_url_template = "/emwp/gov/mogaha/ntis/web/ofr/action/OfrAction.do?jndinm=OfrNotAncmtEJB&context=NTIS&homepage_pbs_yn=Y&method=selectOfrNotAncmt&methodnm=selectOfrNotAncmtRegst&subCheck=Y&not_ancmt_mgt_no={id}"
search_param = "not_ancmt_sj"
page_param = "pageIndex"

