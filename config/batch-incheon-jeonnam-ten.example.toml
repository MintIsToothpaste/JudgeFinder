# Isolated validation. Production config/config.toml is not activated or changed.
# Window: 2025-10-05 through 2026-10-04; new districts/province start July 1.
timezone = "Asia/Seoul"
db_path = "data/live-tests/incheon-jeonnam-ten-2026-10-04/notices.db"
enabled_sources = ["yeonsu", "namdong", "bupyeong", "gyeyang", "seohae", "geomdan", "geomdan_news", "ganghwa", "ongjin", "jeonnam_gwangju", "mokpo", "mokpo_current"]

[sources.yeonsu]
municipality = "연수구"
source_type = "html"
engine_type = "eminwon_ofr"
list_url = "https://eminwon.yeonsu.go.kr/emwp/gov/mogaha/ntis/web/ofr/action/OfrAction.do?jndinm=OfrNotAncmtEJB&context=NTIS&homepage_pbs_yn=Y&method=selectListOfrNotAncmt&methodnm=selectListOfrNotAncmtHomepage&subCheck=Y&ofr_pageSize=15&not_ancmt_se_code=01,02,03,04,06,07&list_gubun=A&countYn=Y"
recruitment_only = true
max_pages = 40
[sources.yeonsu.request_strategy]
session = true
referer = true
timeout_seconds = 75.0
throttle_seconds = 1.0
[sources.yeonsu.html_profile]
container_selector = "table.general_board"
row_selector = "tbody tr:has(> td)"
link_selector = "td:nth-of-type(2) a"
date_selector = "td:nth-of-type(4)"
detail_title_selector = "table.board_view th:-soup-contains-own('목') + td"
detail_date_selector = "table.board_view th:-soup-contains-own('록') + td"
id_pattern = "not_ancmt_mgt_no=([1-9][0-9]*)"
detail_url_template = "/emwp/gov/mogaha/ntis/web/ofr/action/OfrAction.do?jndinm=OfrNotAncmtEJB&context=NTIS&homepage_pbs_yn=Y&method=selectOfrNotAncmt&methodnm=selectOfrNotAncmtRegst&subCheck=Y&not_ancmt_mgt_no={id}"
search_param = "not_ancmt_sj"

