# Isolated live validation; production config and DB remain unchanged.
# Window: 2025-10-05 through 2026-10-04. Do not infer missing dates.
timezone = "Asia/Seoul"
db_path = "data/live-tests/daejeon-ulsan-sejong-gyeonggi-ten-2026-10-04/notices.db"
# Sejong is held: the recruitment has neither a listing nor a detail date.
# Suwon remains diagnostic-only for archive coverage, even if current notices parse.
enabled_sources = ["daedeok","ulsan","ulsan_junggu","ulsan_namgu","ulsan_donggu","ulsan_bukgu","ulju","gyeonggi","suwon"]

[sources.daedeok]
municipality = "대덕구"
source_type = "html"
engine_type = "eminwon_ofr"
list_url = "https://eminwon.daedeok.go.kr/emwp/gov/mogaha/ntis/web/ofr/action/OfrAction.do?not_ancmt_se_code=01,04&jndinm=OfrNotAncmtEJB&context=NTIS&method=selectListOfrNotAncmt&methodnm=selectListOfrNotAncmtHomepage&ofr_pageSize=10&homepage_pbs_yn=Y&subCheck=Y&list_gubun=A"
recruitment_only = true
max_pages = 40
[sources.daedeok.request_strategy]
session = true
referer = true
timeout_seconds = 75.0
throttle_seconds = 1.0
[sources.daedeok.html_profile]
container_selector = "table[width='98%'][cellspacing='1']"
row_selector = "tbody > tr:has(> td:nth-of-type(3)[onclick])"
link_selector = "td:nth-of-type(3)[onclick]"
link_attribute = "onclick"
date_selector = "td:nth-of-type(5)"
detail_title_selector = "td:-soup-contains-own('제목') + td"
detail_date_selector = "td:-soup-contains-own('등록일') + td"
id_pattern = "searchDetail[(]'([1-9][0-9]*)'"
detail_url_template = "/emwp/gov/mogaha/ntis/web/ofr/action/OfrAction.do?jndinm=OfrNotAncmtEJB&context=NTIS&homepage_pbs_yn=Y&method=selectOfrNotAncmt&methodnm=selectOfrNotAncmtRegst&subCheck=Y&not_ancmt_mgt_no={id}"
search_param = "not_ancmt_sj"
page_param = "pageIndex"

