# Isolated live HTML validation; production config and DB remain unchanged.
# Window: 2025-10-05 through 2026-10-04. Daejeon requires explicit date bounds.
timezone = "Asia/Seoul"
db_path = "data/live-tests/jeonnam-daejeon-ten-2026-10-04/notices.db"
enabled_sources = ["hampyeong", "yeonggwang", "jangseong", "wando", "jindo", "shinan", "daejeon", "daejeon_donggu", "daejeon_seogu", "yuseong"]

[sources.hampyeong]
municipality = "함평군"
source_type = "html"
engine_type = "generic_egov_bbs"
list_url = "https://www.hampyeong.go.kr/pg/GosiList.do?pageId=www273&listGubun=A&search_Type=0&notAncmtSeCode=01,02,03,04"
recruitment_only = true
max_pages = 40
[sources.hampyeong.request_strategy]
session = true
referer = true
timeout_seconds = 75.0
throttle_seconds = 1.0
[sources.hampyeong.html_profile]
container_selector = "div.board_list"
row_selector = "div.board_list_body > div.body_row"
link_selector = "div.subject a"
date_selector = "div.regdate"
detail_title_selector = "#board_view th:-soup-contains-own('제목') + td"
detail_date_selector = "#board_view th:-soup-contains-own('등록일') + td"
id_pattern = 'SEQ=([1-9][0-9]*)'
detail_url_template = "/pg/GosiDetail.do?SEQ={id}&pageId=www273&listGubun=A&notAncmtSeCode=01,02,03,04"
search_param = "searchText"
page_param = "pageIndex"

[sources.yeonggwang]
municipality = "영광군"
source_type = "html"
engine_type = "generic_egov_bbs"
list_url = "https://www.yeonggwang.go.kr/bbs/?b_id=gosigonggo&site=headquarter_new&mn=9059&sc_key=subject&per_page=10"
recruitment_only = true
max_pages = 40
[sources.yeonggwang.request_strategy]
session = true
referer = true
timeout_seconds = 75.0
throttle_seconds = 1.0
[sources.yeonggwang.html_profile]
container_selector = "#board_list table"
row_selector = "tbody > tr:has(> td)"
link_selector = "td.t_title a"
date_selector = "td.t_date"
detail_title_selector = "th:-soup-contains-own('제목') + td"
detail_date_selector = "th:-soup-contains-own('등록일') + td"
id_pattern = 'bs_idx=([1-9][0-9]*)'
detail_url_template = "/bbs/?b_id=gosigonggo&site=headquarter_new&mn=9059&type=view&bs_idx={id}"
search_param = "sc_word"
page_param = "page"
offset_param = "offset"
page_size = 10
page_number_selector = "#paginate_complex p.btn_page span.on"

