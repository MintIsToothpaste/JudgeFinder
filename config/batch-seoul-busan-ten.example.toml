# Isolated live validation. Production config/config.toml is unchanged.
# Historical fixtures remain as regression coverage; searches have no fixed cutoff.
# Portal news boards below do not cover every notice board in each municipality.
timezone = "Asia/Seoul"
db_path = "data/live-tests/seoul-busan-ten-2026-09-30/notices.db"
enabled_sources = ["seoul_gangseo","guro","geumcheon","yeongdeungpo","dongjak","seocho","gangnam","songpa","gangdong","busan","seocho_katia","busan_gosi","gangnam_union6"]

[sources.seoul_gangseo]
municipality = "강서구"
source_type = "html"
engine_type = "generic_egov_bbs"
list_url = "https://www.gangseo.seoul.kr/gs040101?srchKey=sj"
recruitment_only = true
[sources.seoul_gangseo.request_strategy]
session = true
referer = true
timeout_seconds = 75.0
throttle_seconds = 1.0
[sources.seoul_gangseo.html_profile]
container_selector = "table.is-board"
row_selector = "tbody tr"
link_selector = "td.is-left a"
date_selector = "td:nth-of-type(4)"
detail_title_selector = "#container h4.subject"
id_pattern = "/gs040101/([1-9][0-9]*)(?:[?]|$)"
detail_url_template = "/gs040101/{id}"
search_param = "srchText"
page_param = "curPage"

[sources.guro]
# The official public archive includes expired postings with list_gubun=A.
municipality = "구로구"
source_type = "html"
engine_type = "eminwon_ofr"
list_url = "https://eminwon.guro.go.kr/emwp/gov/mogaha/ntis/web/ofr/action/OfrAction.do?jndinm=OfrNotAncmtEJB&context=NTIS&homepage_pbs_yn=Y&method=selectListOfrNotAncmt&methodnm=selectListOfrNotAncmtHomepage&subCheck=N&ofr_pageSize=10&not_ancmt_se_code=01,02,04&list_gubun=A"
recruitment_only = true
[sources.guro.request_strategy]
session = true
referer = true
timeout_seconds = 75.0
throttle_seconds = 1.0
[sources.guro.html_profile]
container_selector = "table[summary*='목록표']"
row_selector = "tr[onmouseover]"
link_selector = "td:nth-of-type(3) a"
link_attribute = "onclick"
detail_title_selector = "th:-soup-contains-own('제목') + td"
detail_date_selector = "th:-soup-contains-own('등록일') + td"
id_pattern = "searchDetail\\('([1-9][0-9]*)'\\)"
detail_url_template = "/emwp/gov/mogaha/ntis/web/ofr/action/OfrAction.do?jndinm=OfrNotAncmtEJB&context=NTIS&homepage_pbs_yn=Y&method=selectOfrNotAncmt&methodnm=selectOfrNotAncmtRegst&subCheck=N&not_ancmt_mgt_no={id}"
search_param = "not_ancmt_sj"

