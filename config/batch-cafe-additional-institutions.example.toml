max_pages = 80
[sources.busan_bistep.request_strategy]
session = true
referer = true
retries = 2
timeout_seconds = 30.0
throttle_seconds = 0.3
[sources.busan_bistep.html_profile]
container_selector = "table.bdListTbl"
row_selector = "tbody > tr"
link_selector = "td.subject a"
date_selector = "td.date"
id_pattern = "[?&]board_seq=([1-9][0-9]*)(?:&|$)"
detail_url_template = "/kor/CMS/Board/Board.do?mCode=MN010&mode=view&mgr_seq=23&board_seq={id}"
search_param = "searchKeyword"
page_param = "page"
page_number_selector = ".pagelist > strong"
detail_title_selector = "h3.viewTit"
detail_date_selector = ".viewTitWinfo span.date"

[sources.daejeon_junggu]
municipality = "대전 중구"
source_type = "html"
engine_type = "generic_egov_bbs"
list_url = "https://www.djjunggu.go.kr/prog/saeolGosi/GOSI_03/sub03_06/list.do?searchCondition=notAncmtSj"
recruitment_only = false
max_pages = 80
[sources.daejeon_junggu.request_strategy]
session = true
referer = true
retries = 2
timeout_seconds = 30.0
throttle_seconds = 0.3
[sources.daejeon_junggu.html_profile]
container_selector = "table.table-default"
row_selector = "tbody > tr"
link_selector = "td.subject a"
link_attribute = "onclick"
date_selector = "td[data-cell-header='등록일']"
id_pattern = "fn_search_detail[(]'([1-9][0-9]*)'"
detail_url_template = "/prog/saeolGosi/GOSI_03/sub03_06/view.do?notAncmtMgtNo={id}"
search_param = "searchKeyword"
page_param = "pageIndex"
page_number_selector = ".pagination li.active"
detail_title_selector = "h2.bbs--view--tit"

[sources.uiseong]
municipality = "의성군"
source_type = "html"
engine_type = "generic_egov_bbs"
list_url = "https://www.usc.go.kr/ko/page.do?mnu_uid=157&srchColumn=title"
recruitment_only = false
max_pages = 80
[sources.uiseong.request_strategy]
session = true
referer = true
retries = 2
timeout_seconds = 30.0
throttle_seconds = 0.3
[sources.uiseong.html_profile]
container_selector = "table.tbl_board"
row_selector = "tbody > tr"
link_selector = "td.subject a"
date_selector = "td.date"
id_pattern = "[?&]not_ancmt_mgt_no=([1-9][0-9]*)(?:&|$)"
detail_url_template = "/ko/page.do?mnu_uid=157&not_ancmt_mgt_no={id}&cmd=2"
search_param = "srchKwd"
page_param = "pageNo"
page_number_selector = ".paging > strong"
detail_title_selector = "dl.title > dt"
detail_date_selector = "dl.data > dt:-soup-contains-own('등록일') + dd"

