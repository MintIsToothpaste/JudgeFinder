# Public boards for the seven institutions missing from the cafe comparison.
# Keep existing municipality batches; this is an additional collection batch.
# Broad title keyword collection: human review handles results and ambiguous notices.
timezone = "Asia/Seoul"
db_path = "data/cafe-additional-institutions.db"
enabled_sources = ["hwaseong_talent", "changwon_lepopark", "busan_technopark", "busan_bistep", "daejeon_junggu", "uiseong", "busan_bepa_small_business", "busan_bepa_regional_business", "busan_bepa_youth", "busan_bepa_workforce", "busan_bepa_industry", "busan_bepa_notices"]

# The official HSTree form also sends the UTF-8 search term as Base64.
[sources.hwaseong_talent]
municipality = "화성시인재육성재단"
source_type = "html"
engine_type = "generic_egov_bbs"
list_url = "https://www.hstree.org/news/notice.do?brdSrchSel=1&search_Text=7Y%2BJ6rCA7JyE7JuQ"
recruitment_only = false
max_pages = 80
[sources.hwaseong_talent.request_strategy]
session = true
referer = true
retries = 2
timeout_seconds = 30.0
throttle_seconds = 0.3
[sources.hwaseong_talent.html_profile]
container_selector = "table.brd_list"
row_selector = "tbody > tr"
link_selector = "p.subject a"
date_selector = "td:nth-of-type(4)"
id_pattern = "[?&]seq=([1-9][0-9]*)(?:&|$)"
detail_url_template = "/news/noticeView.do?seq={id}"
search_param = "brdSrchStr"
page_param = "pageIndex"
page_number_selector = ".pagination li.active"
detail_title_selector = ".view_header strong.subject"
detail_date_selector = ".view_header span:-soup-contains-own('작성일') + span.data"

[sources.changwon_lepopark]
municipality = "창원레포츠파크"
source_type = "html"
engine_type = "generic_egov_bbs"
list_url = "https://www.lepopark.or.kr/post/noticesp/?where=title"
recruitment_only = false
max_pages = 80
[sources.changwon_lepopark.request_strategy]
session = true
referer = true
retries = 2
timeout_seconds = 30.0
throttle_seconds = 0.3
[sources.changwon_lepopark.html_profile]
container_selector = "table.board.list"
row_selector = "tbody > tr"
link_selector = "td.title a"
date_selector = "td.date"
id_pattern = "^([1-9][0-9]*)$"
detail_url_template = "/post/noticesp/{id}"
search_param = "keyword"
page_param = "page"
# Out-of-range pages have an empty table and no active pager.

[sources.busan_technopark]
municipality = "부산테크노파크"
source_type = "html"
engine_type = "generic_egov_bbs"
list_url = "https://www.btp.or.kr/kor/CMS/Board/Board.do?mCode=MN013&mode=list"
recruitment_only = false
max_pages = 80
[sources.busan_technopark.request_strategy]
session = true
referer = true
retries = 2
timeout_seconds = 30.0
throttle_seconds = 0.3
[sources.busan_technopark.html_profile]
container_selector = "table.bdListTbl"
row_selector = "tbody > tr"
link_selector = "td.subject a"
date_selector = "td.date"
id_pattern = "[?&]board_seq=([1-9][0-9]*)(?:&|$)"
detail_url_template = "/kor/CMS/Board/Board.do?mCode=MN013&mode=view&mgr_seq=16&board_seq={id}"
search_param = "searchKeyword"
page_param = "page"
page_number_selector = ".pagelist > strong"
detail_title_selector = "h3.view-tit"

[sources.busan_bistep]
municipality = "부산과학기술고등교육진흥원"
source_type = "html"
engine_type = "generic_egov_bbs"
